[package]
name = "harnesses-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust-first, fail-closed multi-agent orchestration runtime"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

