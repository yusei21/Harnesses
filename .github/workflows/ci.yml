name: harness-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_domain_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python -m harness.cli eval
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - run: cargo run --manifest-path rust/Cargo.toml --bin harnesses-ops -- audit
